spring.application.name=student-skill-internship-portal
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/student_portal?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false

app.jwt.secret=${JWT_SECRET:change-this-development-secret-key-which-is-at-least-32-bytes-long}
app.jwt.expiration-ms=86400000

app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:5173}

app.seed-data=true